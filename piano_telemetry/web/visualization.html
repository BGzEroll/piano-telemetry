<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>可视化 · Piano Telemetry</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="visualization-page">
  <nav class="topbar">
    <a class="brand" href="/">Piano <span>Telemetry</span></a>
    <div class="nav-links">
      <a class="active" href="/">可视化</a>
      <a href="/mapping">按键映射</a>
      <a href="/sessions">录制</a>
      <a href="/settings">设置</a>
    </div>
  </nav>

  <main class="visual-shell">
    <header class="visual-header">
      <h1>实时演奏</h1>
      <div class="visual-actions">
        <div class="live-indicator"><span id="ws-dot"></span><b id="ws-status">连接中</b></div>
        <button id="record-toggle" class="record-toggle" type="button">
          <i aria-hidden="true"></i>
          <span id="record-label">开始录制</span>
        </button>
      </div>
    </header>

    <section class="metric-strip">
      <div class="metric tonality-metric">
        <span>当前调式</span>
        <div id="tonality-select" class="custom-select metric-select">
          <button id="tonality-trigger" class="select-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="tonality-options">
            <span id="tonality-value">C 大调</span>
            <i class="select-chevron" aria-hidden="true"></i>
          </button>
          <div id="tonality-options" class="select-options" role="listbox" aria-label="当前调式" hidden></div>
        </div>
      </div>
      <div class="metric"><span>当前和弦</span><strong id="chord">—</strong></div>
      <div class="metric"><span>力度</span><strong id="velocity">0</strong></div>
      <div class="metric"><span>延音踏板</span><strong id="sustain">0</strong></div>
      <div class="metric"><span>事件序号</span><strong id="sequence">—</strong></div>
    </section>

    <section class="waterfall-panel">
      <canvas id="waterfall"></canvas>
      <canvas id="keyboard"></canvas>
    </section>

    <footer class="visual-footer">
      <span id="note-list">当前没有按键</span>
      <span id="record-message" class="record-message" aria-live="polite"></span>
      <span id="data-warning"></span>
    </footer>
  </main>

  <div id="record-dialog-backdrop" class="record-dialog-backdrop" hidden>
    <form id="record-dialog" class="record-dialog" role="dialog" aria-modal="true" aria-labelledby="record-save-label">
      <label id="record-save-label" for="record-save-name">保存名称：</label>
      <input id="record-save-name" type="text" maxlength="100" autocomplete="off">
      <span id="record-dialog-error" class="record-dialog-error" aria-live="polite"></span>
      <div class="record-dialog-actions">
        <button id="record-save" class="button primary" type="submit">保存</button>
        <button id="record-discard" class="button danger" type="button">不保存</button>
      </div>
    </form>
  </div>

  <div id="push-dialog-backdrop" class="record-dialog-backdrop" hidden>
    <div id="push-dialog" class="record-dialog push-dialog" role="dialog" aria-modal="true" aria-labelledby="push-dialog-title">
      <strong id="push-dialog-title">是否推送？</strong>
      <p id="push-dialog-description"></p>
      <span id="push-dialog-message" class="push-dialog-message" aria-live="polite"></span>
      <div class="record-dialog-actions">
        <button id="push-now" class="button primary" type="button">推送</button>
        <button id="push-later" class="button ghost" type="button">暂不推送</button>
      </div>
    </div>
  </div>
  <script src="/static/visualization.js"></script>
</body>
</html>
