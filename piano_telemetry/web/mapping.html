<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>按键映射 · Piano Telemetry</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/">Piano <span>Telemetry</span></a>
    <div class="nav-links">
      <a href="/">可视化</a>
      <a class="active" href="/mapping">按键映射</a>
      <a href="/sessions">录制</a>
      <a href="/settings">设置</a>
    </div>
  </nav>

  <main class="page-shell mapping-shell">
    <header class="page-heading">
      <h1>按键映射</h1>
    </header>

    <section class="settings-panel mapping-status-panel">
      <label class="toggle-row mapping-master-toggle">
        <span><b>启用映射</b><small>电钢琴键按下和松开时，向当前前台程序发送对应的键盘事件。</small></span>
        <input id="mapping-enabled" type="checkbox"><i></i>
      </label>
      <span id="mapping-message" class="action-message" aria-live="polite"></span>
    </section>

    <section class="settings-panel mapping-preset-panel">
      <div class="panel-title">
        <h2>映射预设</h2>
        <span id="preset-state" class="binding-count">当前配置未关联预设</span>
      </div>
      <div class="preset-toolbar">
        <div id="preset-select" class="custom-select preset-select">
          <button id="preset-trigger" class="select-trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="preset-options">
            <span id="preset-value">选择预设</span>
            <i class="select-chevron" aria-hidden="true"></i>
          </button>
          <div id="preset-options" class="select-options" role="listbox" aria-label="映射预设" hidden></div>
        </div>
        <button id="preset-load" class="button success" type="button" disabled>加载预设</button>
        <button id="preset-save-as" class="button primary" type="button">保存为预设</button>
        <button id="preset-overwrite" class="button ghost" type="button" disabled>覆盖预设</button>
        <button id="preset-delete" class="button danger" type="button" disabled>删除预设</button>
      </div>
    </section>

    <section class="settings-panel mapping-editor">
      <div class="panel-title mapping-editor-title">
        <div>
          <h2>选择钢琴键</h2>
          <p>点击琴键，或让程序学习下一次电钢输入。</p>
        </div>
        <button id="learn-note" class="button ghost" type="button">按下电钢选键</button>
      </div>

      <div class="selected-note-row">
        <span>当前选择</span>
        <strong id="selected-note">未选择</strong>
        <button id="clear-binding" class="button danger compact" type="button" disabled>清除绑定</button>
      </div>

      <div id="piano-scroll" class="mapping-piano-scroll">
        <div id="mapping-piano" class="mapping-piano" aria-label="88 键钢琴键盘"></div>
      </div>

      <div class="keyboard-heading">
        <h2>绑定电脑键盘</h2>
        <span>仅支持字母键和主键盘数字键，不包含小键盘。</span>
      </div>
      <div id="computer-keyboard" class="computer-keyboard"></div>
    </section>

    <section class="settings-panel">
      <div class="panel-title">
        <h2>已配置映射</h2>
        <div class="binding-list-actions">
          <span id="binding-count" class="binding-count">0 个</span>
          <button id="clear-all-bindings" class="button danger compact" type="button" disabled>清空当前映射</button>
        </div>
      </div>
      <div id="binding-list" class="binding-list"></div>
    </section>
  </main>

  <div id="preset-dialog-backdrop" class="record-dialog-backdrop" hidden>
    <form id="preset-dialog" class="record-dialog" role="dialog" aria-modal="true" aria-labelledby="preset-dialog-title">
      <strong id="preset-dialog-title">保存为预设</strong>
      <label for="preset-name">预设名称：</label>
      <input id="preset-name" type="text" maxlength="100" autocomplete="off">
      <span id="preset-dialog-error" class="record-dialog-error" aria-live="polite"></span>
      <div class="record-dialog-actions">
        <button id="preset-cancel" class="button ghost" type="button">取消</button>
        <button id="preset-confirm" class="button primary" type="submit">保存</button>
      </div>
    </form>
  </div>
  <script src="/static/mapping.js"></script>
</body>
</html>
